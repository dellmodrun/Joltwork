name: protocol-ci

on:
  push:
    paths:
      - "programs/**"
      - "sdk/**"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
    paths:
      - "programs/**"
      - "sdk/**"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Jolt Guard
        run: cargo test --manifest-path programs/jolt-guard/Cargo.toml

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        working-directory: sdk
        run: npm ci
      - name: Build and test SDK
        working-directory: sdk
        run: npm test
